<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Aayvu — the AI agent that programs your surveys</title>
  <desc id="desc">A warm, branded social preview showing a questionnaire transformed into a completed survey.</desc>
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e9a52d"/>
      <stop offset="0.52" stop-color="#bd650c"/>
      <stop offset="1" stop-color="#8b3f0a"/>
    </linearGradient>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff9eb"/>
      <stop offset="1" stop-color="#f3e4cc"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#6f451d" flood-opacity="0.14"/>
    </filter>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="46"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="#faf9f6"/>
  <circle cx="1035" cy="96" r="250" fill="#f3b64e" opacity="0.14" filter="url(#soft)"/>
  <circle cx="80" cy="620" r="250" fill="#bd650c" opacity="0.08" filter="url(#soft)"/>

  <g transform="translate(74 64)">
    <text x="0" y="42" fill="#29241e" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" letter-spacing="-1.5">aayvu</text>
    <g transform="translate(111 8)" fill="none" stroke="#bd650c" stroke-width="4" stroke-linecap="round">
      <path d="M18 0v36M0 18h36M5.3 5.3l25.4 25.4M30.7 5.3L5.3 30.7"/>
    </g>

    <text x="0" y="160" fill="#29241e" font-family="Arial, Helvetica, sans-serif" font-size="62" font-weight="700" letter-spacing="-2.6">Your survey,</text>
    <text x="0" y="226" fill="url(#brand)" font-family="Arial, Helvetica, sans-serif" font-size="62" font-weight="700" letter-spacing="-2.6">programmed by</text>
    <text x="0" y="292" fill="url(#brand)" font-family="Arial, Helvetica, sans-serif" font-size="62" font-weight="700" letter-spacing="-2.6">an AI agent.</text>
    <text x="0" y="348" fill="#6b6054" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400">From questionnaire to launch-ready survey.</text>

    <g transform="translate(0 402)">
      <rect x="0" y="0" width="300" height="72" rx="36" fill="url(#brand)"/>
      <text x="150" y="45" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">web.aayvu.io</text>
      <text x="328" y="45" fill="#6b6054" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600">Better questions. Closer answers.</text>
    </g>
  </g>

  <g transform="translate(815 125)" filter="url(#shadow)">
    <rect x="0" y="0" width="295" height="390" rx="28" fill="#ffffff" stroke="#e6dccb" stroke-width="2"/>
    <rect x="30" y="30" width="116" height="17" rx="8.5" fill="#29241e" opacity="0.92"/>
    <rect x="30" y="59" width="194" height="10" rx="5" fill="#c9bba4"/>
    <rect x="30" y="78" width="152" height="10" rx="5" fill="#ded4c4"/>

    <g transform="translate(30 122)">
      <rect width="235" height="78" rx="14" fill="url(#wash)" stroke="#ead7b8"/>
      <circle cx="24" cy="25" r="8" fill="#bd650c"/>
      <rect x="43" y="18" width="150" height="11" rx="5.5" fill="#51483e"/>
      <rect x="18" y="47" width="199" height="12" rx="6" fill="#ffffff" stroke="#dfd7cc"/>
    </g>
    <g transform="translate(30 216)">
      <rect width="235" height="78" rx="14" fill="#ffffff" stroke="#e6dccb"/>
      <circle cx="24" cy="25" r="8" fill="none" stroke="#bd650c" stroke-width="3"/>
      <rect x="43" y="18" width="132" height="11" rx="5.5" fill="#51483e"/>
      <rect x="18" y="47" width="199" height="12" rx="6" fill="#f2ede5"/>
    </g>
    <g transform="translate(30 310)">
      <rect width="235" height="50" rx="14" fill="#29241e"/>
      <text x="118" y="32" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="0.4">READY FOR REVIEW</text>
    </g>
  </g>

  <g transform="translate(763 282)" fill="#ffffff" stroke="#bd650c" stroke-width="3">
    <circle cx="0" cy="0" r="29" fill="#fff9eb"/>
    <path d="M-10 0h20M4-6l6 6-6 6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
